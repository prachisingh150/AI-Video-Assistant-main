services:
  - type: web
    name: ai-video-assistant
    runtime: python
    buildCommand: |
      pip install -r Requirements.txt
      apt-get update && apt-get install -y ffmpeg || true
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MISTRAL_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: "tiny"
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_MODEL
        value: "saaras:v2.5"
